---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      frontend:
        patterns:
          - "*"
    # ponytail: TS 7 breaks @hey-api/openapi-ts; drop this once it supports 7
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
